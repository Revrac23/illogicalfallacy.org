name: Hugo site checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Netlify's Hugo version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("netlify.toml", "rb"))["build"]["environment"]["HUGO_VERSION"])')
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${version}/hugo_extended_${version}_linux-amd64.tar.gz" \
            --output "$RUNNER_TEMP/hugo.tar.gz"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build with Netlify's command
        run: |
          hugo version
          python3 - <<'PY'
          import os
          import shlex
          import subprocess
          import tomllib
          from pathlib import Path

          with open("netlify.toml", "rb") as config:
              command = tomllib.load(config)["build"]["command"]
          scratch = Path(os.environ["RUNNER_TEMP"])
          subprocess.run(shlex.split(command) + [
              "--destination", str(scratch / "site-output"),
              "--cacheDir", str(scratch / "hugo-cache"),
              "--noBuildLock",
          ], check=True)
          PY

      - name: Test generated site
        run: |
          python3 -m venv "$RUNNER_TEMP/site-venv"
          "$RUNNER_TEMP/site-venv/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/site-venv/bin/python" tests/check_site.py "$RUNNER_TEMP/site-output" -v
