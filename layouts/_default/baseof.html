<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "en-US" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {{ if .IsHome }}
      {{ site.Title }}
    {{ else }}
      {{ .Title }} · {{ site.Title }}
    {{ end }}
  </title>

  {{ with .Description }}
    <meta name="description" content="{{ . }}">
  {{ end }}

  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
</head>

<body>

  {{ partial "header.html" . }}

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

</body>
</html>
