<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {{ if .IsHome }}
      {{ site.Title }}
    {{ else }}
      {{ .Title }} · {{ site.Title }}
    {{ end }}
  </title>

  {{ with site.Params.description }}
    <meta name="description" content="{{ . }}">
  {{ end }}

  {{ $style := resources.Get "css/main.css" }}
  {{ if $style }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}">
  {{ end }}
</head>

<body>
  <header class="site-header">
    <div class="container">
      <a class="site-title" href="{{ site.Home.RelPermalink }}">
        Illogical Fallacy
      </a>

      <nav>
        <a href="{{ site.Home.RelPermalink }}">Home</a>
        <a href="/fallacies/">Fallacies</a>
      </nav>
    </div>
  </header>

  {{ block "main" . }}{{ end }}

  <footer class="site-footer">
    <div class="container">
      <p>
        Illogical Fallacy · A reference guide to logical fallacies
      </p>
    </div>
  </footer>
  {{ $search := resources.Get "js/search.js" }}
<script src="{{ $search.RelPermalink }}" defer></script>
</body>
</html>
